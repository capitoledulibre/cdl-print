[project]
name = "cdl-paper-generator"
version = "0.1.0"
description = "Capitole du Libre Paper Schedule Generator"
authors = [{ name = "Capitole du Libre", email = "contact@capitoledulibre.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "segno>=1.6.6",
    "weasyprint",
]

[tool.uv]
# gen.py is a standalone script, not an installable package.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
