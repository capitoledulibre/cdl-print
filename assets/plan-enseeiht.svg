  <g font-size="22" font-weight="700" text-anchor="middle">
    <g transform="translate(105 362)">
      <path d="M0 0C-10-20-18-28-18-42A18 18 0 1 1 18-42C18-28 10-20 0 0Z" fill="#1f3f6b" stroke="#ffffff" stroke-width="2"/>
