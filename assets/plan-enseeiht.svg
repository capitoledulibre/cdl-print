  <rect x="410" y="88" width="305" height="150" rx="16" fill="#d03d00"/>
  <rect x="55" y="300" width="195" height="150" rx="16" fill="#957e7e"/>
  <g font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="163" y="182">A</text>
    <text x="562.5" y="185">B</text>
    <text x="152.5" y="440">C</text>
  </g>

