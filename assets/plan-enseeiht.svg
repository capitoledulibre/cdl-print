<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Fira Sans" role="img" aria-label="Plan schématique du campus de l'ENSEEIHT">
  <!-- Redrawn for print from the plan on capitoledulibre.org/lieu/: the
       same geometry and building colours, without the shadows and sheen
       the PDF renderer cannot draw, and with numbered pins instead of
       icons, so the legend still reads in a greyscale run. -->
  <rect x="12" y="12" width="736" height="456" rx="28" fill="#ece9e4" stroke="#ddd8d0" stroke-width="2"/>

  <rect x="295" y="250" width="345" height="200" rx="46" fill="#d3e9b4"/>
  <path d="M335 300 L600 425 M575 268 L360 440" stroke="#f4f7ee" stroke-width="13" stroke-linecap="round" fill="none"/>
  <g fill="#82b94c">
    <circle cx="322" cy="276" r="7"/>
    <circle cx="470" cy="262" r="7"/>
    <circle cx="612" cy="292" r="7"/>
    <circle cx="335" cy="432" r="7"/>
    <circle cx="608" cy="428" r="7"/>
  </g>

  <g font-size="21" font-weight="700" fill="#1a365d" text-anchor="middle">
    <text x="300" y="40">Entrée</text>
    <text x="396" y="40">Sortie</text>
  </g>
  <path d="M295 52h10v28h7l-12 16-12-16h7z" fill="#2f855a"/>
  <path d="M391 96h10V68h7l-12-16-12 16h7z" fill="#c05621"/>

